services:
  # Leash Gateway (MCP & REST API)
  - type: web
    name: leash-gateway
    env: node
    plan: standard
    buildCommand: pnpm install && pnpm build --filter=@leash/gateway...
    startCommand: node apps/gateway/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: leash-db
          property: connectionString
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: leash-ml
          property: host

  # Next.js Console & Approvals PWA
  - type: web
    name: leash-console
    env: node
    plan: standard
    buildCommand: pnpm install && pnpm build --filter=@leash/console...
    startCommand: pnpm --filter=@leash/console start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_GATEWAY_URL
        fromService:
          type: web
          name: leash-gateway
          property: host

  # Demo Stores & Merchant Agents
  - type: web
    name: leash-stores
    env: node
    plan: standard
    buildCommand: pnpm install && pnpm build --filter=@leash/stores...
    startCommand: pnpm --filter=@leash/stores start
    envVars:
      - key: NODE_ENV
        value: production

  # Python ML Service (Isolation Forest & Injection Classifier)
  - type: web
    name: leash-ml
    env: python
    plan: standard
    buildCommand: pip install -r services/ml/requirements.txt
    startCommand: uvicorn services.ml.main:app --host 0.0.0.0 --port 8000

databases:
  - name: leash-db
    plan: standard
    postgresMajorVersion: 16
