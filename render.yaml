services:
  # Leash Gateway (MCP Server & Decision Arbiter REST API)
  - type: web
    name: leash-gateway
    env: node
    plan: free
    buildCommand: pnpm install --ignore-scripts && pnpm build
    startCommand: node apps/gateway/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: leash-db
          property: connectionString
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: leash-ml
          property: hostport
      # Public URL of the console, so browsers may call the gateway (CORS)
      - key: CORS_ORIGINS
        sync: false

  # Next.js 15 Console with AG Grid Immutable Ledger
  - type: web
    name: leash-console
    env: node
    plan: free
    buildCommand: pnpm install --ignore-scripts && pnpm build
    startCommand: pnpm --filter=@leash/console start
    envVars:
      - key: NODE_ENV
        value: production
      # Must be the gateway's PUBLIC https URL (e.g. https://leash-gateway.onrender.com).
      # NEXT_PUBLIC_* values are inlined at build time and read by the browser,
      # so Render's private service host cannot be used here.
      - key: NEXT_PUBLIC_GATEWAY_URL
        sync: false

  # Autonomous Buyer Shopping Agent with Live Attack Mode
  - type: web
    name: leash-buyer-agent
    env: node
    plan: free
    buildCommand: pnpm install --ignore-scripts && pnpm build
    startCommand: node apps/buyer-agent/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: GATEWAY_URL
        fromService:
          type: web
          name: leash-gateway
          property: host

  # Demo Storefronts (GadgetHub, TrendBoutique, DailyMart)
  - type: web
    name: leash-stores
    env: node
    plan: free
    buildCommand: pnpm install --ignore-scripts && pnpm build
    startCommand: node apps/stores/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production

  # Python ML Anomaly Service (Layer 4 Isolation Forest & Classifier)
  - type: web
    name: leash-ml
    env: python
    plan: free
    buildCommand: pip install -r services/ml/requirements.txt
    startCommand: uvicorn services.ml.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.10"
      - key: PYTHONPATH
        value: "."
      - key: PYTHONUNBUFFERED
        value: "1"

databases:
  # Managed PostgreSQL for Tamper-Evident Ledger & Mutex Budget Locking
  - name: leash-db
    plan: free
    postgresMajorVersion: 16
