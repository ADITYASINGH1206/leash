services:
  # Leash Gateway (MCP Server & Decision Arbiter REST API)
  - type: web
    name: leash-gateway
    env: node
    plan: free
    buildCommand: pnpm install --ignore-scripts && pnpm build
    startCommand: node apps/gateway/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Demo mode: mandates, transactions and the ledger are kept in memory and are
      # lost on restart. The Postgres-backed path cannot yet store mandates, so a
      # database-backed gateway would fail closed on every payment. Remove this line,
      # and uncomment DATABASE_URL below, only once that persistence work lands.
      - key: LEASH_STORAGE
        value: memory
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: leash-db
      #     property: connectionString
      # IANA timezone for the quiet-hours policy rule (the demoing user's local night)
      - key: LEASH_USER_TIMEZONE
        value: America/Los_Angeles
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # Optional: only used by POST /api/v1/mandates/compile
      - key: GEMINI_API_KEY
        sync: false
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: leash-ml
          property: hostport
      # Public URL of the console, so browsers may call the gateway (CORS)
      # e.g. https://leash-console.onrender.com
      - key: CORS_ORIGINS
        sync: false

  # Next.js 15 Console with AG Grid Immutable Ledger
  - type: web
    name: leash-console
    env: node
    plan: free
    buildCommand: pnpm install --ignore-scripts && pnpm build
    startCommand: pnpm --filter=@leash/console start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # Must be the gateway's PUBLIC https URL, copied from the leash-gateway service
      # page in the Render dashboard. Render service names are global: if "leash-gateway"
      # was taken, yours is https://leash-gateway-<suffix>.onrender.com, and the plain
      # name belongs to somebody else's service. NEXT_PUBLIC_* values are inlined at
      # build time, so after changing this value redeploy the console with
      # "Clear build cache & deploy". Details: docs/DEPLOYMENT.md.
      - key: NEXT_PUBLIC_GATEWAY_URL
        sync: false

  # Autonomous Buyer Shopping Agent with Live Attack Mode
  - type: web
    name: leash-buyer-agent
    env: node
    plan: free
    buildCommand: pnpm install --ignore-scripts && pnpm build
    startCommand: node apps/buyer-agent/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      # The buyer agent embeds the gateway engine in-process, so it needs no gateway URL.
      - key: LEASH_STORAGE
        value: memory

  # Demo Storefronts (GadgetHub, TrendBoutique, DailyMart)
  - type: web
    name: leash-stores
    env: node
    plan: free
    buildCommand: pnpm install --ignore-scripts && pnpm build
    startCommand: node apps/stores/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production

  # Python ML Anomaly Service (Layer 4 Isolation Forest & Classifier)
  - type: web
    name: leash-ml
    env: python
    plan: free
    buildCommand: pip install -r services/ml/requirements.txt
    startCommand: uvicorn services.ml.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.10"
      - key: PYTHONPATH
        value: "."
      - key: PYTHONUNBUFFERED
        value: "1"

# The leash-db Postgres database is intentionally not provisioned: the gateway runs
# with LEASH_STORAGE=memory (see above). To use Postgres once mandate persistence
# exists, add:
#
# databases:
#   - name: leash-db
#     plan: free
#     postgresMajorVersion: 16
