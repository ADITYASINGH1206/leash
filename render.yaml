services:
  # Leash Gateway (MCP Server & Decision Arbiter REST API)
  - type: web
    name: leash-gateway
    env: node
    plan: standard
    buildCommand: pnpm install --ignore-scripts && pnpm build
    startCommand: node apps/gateway/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: leash-db
          property: connectionString
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: leash-ml
          property: host

  # Next.js 15 Console with AG Grid Immutable Ledger
  - type: web
    name: leash-console
    env: node
    plan: standard
    buildCommand: pnpm install --ignore-scripts && pnpm build
    startCommand: pnpm --filter=@leash/console start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_GATEWAY_URL
        fromService:
          type: web
          name: leash-gateway
          property: host

  # Autonomous Buyer Shopping Agent with Live Attack Mode
  - type: web
    name: leash-buyer-agent
    env: node
    plan: standard
    buildCommand: pnpm install --ignore-scripts && pnpm build
    startCommand: node apps/buyer-agent/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: GATEWAY_URL
        fromService:
          type: web
          name: leash-gateway
          property: host

  # Python ML Anomaly Service (Layer 4 Isolation Forest & Classifier)
  - type: web
    name: leash-ml
    env: python
    plan: standard
    buildCommand: pip install -r services/ml/requirements.txt
    startCommand: uvicorn services.ml.main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"

databases:
  # Managed PostgreSQL for Tamper-Evident Ledger & Mutex Budget Locking
  - name: leash-db
    plan: standard
    postgresMajorVersion: 16
